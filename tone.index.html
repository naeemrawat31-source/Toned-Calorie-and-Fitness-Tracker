<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#101828;--mute:#667085;--line:#e6e9f0;--track:#e9edf5;--ring:#2f6bff;--p:#7c5cfc;--c:#f59e0b;--f:#10b981;--bad:#ef4444;--acc:#101828;--accink:#fff;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h2{font-size:16px;font-weight:700;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:0}
.date{display:flex;align-items:center;gap:6px}
.date b{font-size:17px;font-weight:700;min-width:96px;text-align:center}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;box-shadow:var(--sh)}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:none;color:var(--mute);font:600 13px inherit;font-family:inherit;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.side{text-align:center}.side b{display:block;font-size:20px;font-weight:700}.side span{font-size:12px;color:var(--mute)}
.ringwrap{position:relative;width:170px;height:170px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}

.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid .pct{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mid .lbl{font-size:12px;color:var(--mute);margin-top:4px}

.mac .t span:last-child{color:var(--mute);font-weight:500}

.mac .bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
.mac .v{font-size:12px;color:var(--mute)}.mac .v b{color:var(--ink);font-size:15px}
.link{display:block;width:100%;margin-top:18px;border:0;border-top:1px solid var(--line);background:none;color:var(--ring);font:600 14px inherit;font-family:inherit;padding:14px 0 0;cursor:pointer}
label{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:500 16px inherit;font-family:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.g{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:14px}.g2{grid-template-columns:repeat(2,1fr)}
.sp2{grid-column:span 2}.sp3{grid-column:1/-1}
.btn{font:700 15px inherit;font-family:inherit;border:0;border-radius:14px;padding:14px;background:var(--acc);color:var(--accink);cursor:pointer;width:100%}
.btn.sec{background:var(--track);color:var(--ink)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.add{border:0;background:var(--ring);color:#fff;font:700 14px inherit;font-family:inherit;border-radius:20px;padding:8px 16px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font:500 13px inherit;font-family:inherit;cursor:pointer}
.meal{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:16px 0 4px}.meal span:last-child{color:var(--mute);font-weight:500}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.meal+.item{border-top:0}

.item .k{font-weight:700;font-size:14px;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:2px 6px}
.empty{color:var(--mute);font-size:14px;padding:14px 0 4px;text-align:center}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--ring) 18%,var(--bg)) 0,var(--bg) 380px) no-repeat,var(--bg)}
.card.goal{border:0;background:linear-gradient(160deg,color-mix(in srgb,var(--ring) 14%,var(--card)),color-mix(in srgb,var(--p) 8%,var(--card)) 70%)}
.pill{display:inline-block;margin-bottom:16px;padding:6px 12px;border-radius:20px;font:700 12px inherit;font-family:inherit;color:var(--col);background:color-mix(in srgb,var(--col) 15%,var(--card))}
.macros{gap:8px}
.mac{border-radius:16px;padding:11px 10px;background:color-mix(in srgb,var(--col) 12%,var(--card))}
.mac .t span:first-child{color:var(--col);font-weight:700}
.mac .bar{background:color-mix(in srgb,var(--col) 22%,var(--card))}
.hero .side:first-child b{color:var(--ring)}.hero .side:last-child b{color:var(--p)}

.item .k{color:var(--ring)}
.md{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
main{padding-bottom:110px}
:root{--w:#0284c7}

:root[data-theme="dark"]{--w:#38bdf8}
.wbar{height:12px;border-radius:8px;background:color-mix(in srgb,var(--w) 20%,var(--card));overflow:hidden;margin:4px 0 14px}
.wbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--w),color-mix(in srgb,var(--w) 60%,var(--p)));transition:width .4s}
.wbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.wcus{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}
.wcus .btn{width:auto;padding:11px 16px}.wcus .btn:disabled{opacity:.45;cursor:default}
.link{display:flex;align-items:center;justify-content:center;gap:8px}.link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wk,.cg{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk{font-size:12px;font-weight:600;margin-bottom:10px}
.cd{display:block;width:100%;padding:0;border-radius:50%;transition:background .2s}
.cd svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cd .a{stroke:color-mix(in srgb,var(--track) 75%,transparent)}
.cd span{line-height:1;font-size:14px;font-weight:600}
.cd.sel{background:color-mix(in srgb,var(--ring) 15%,transparent)}
.cd.sel span{color:var(--ring);font-weight:800}
.cd.td::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ring)}
.leg{padding-top:2px}
select{-webkit-appearance:none;appearance:none;padding-right:38px;font-weight:600;cursor:pointer;background-color:var(--bg);transition:border-color .15s}

option{background:var(--card);color:var(--ink)}
.sw{position:relative;min-width:0}
.sw svg{position:absolute;right:14px;top:50%;width:11px;height:11px;margin-top:-5.5px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .15s}
.sw:hover svg,.sw:focus-within svg{stroke:var(--ring)}
.nat{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.sb{width:100%;display:flex;align-items:center;text-align:left;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:11px 38px 11px 14px;cursor:pointer;transition:border-color .15s}
.sb:hover,.sw.open .sb{border-color:color-mix(in srgb,var(--ring) 45%,var(--line))}
.sw.open svg{stroke:var(--ring)}.sw.open .sb svg{transform:rotate(180deg)}
.sw.open{z-index:31}
.sl{display:block;visibility:hidden;opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top center;pointer-events:none;transition:opacity .18s ease,transform .24s cubic-bezier(.22,.8,.3,1),visibility 0s linear .24s;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 34px rgba(16,24,40,.2);max-height:260px;overflow:auto}
.sw.open .sl{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .18s ease,transform .24s cubic-bezier(.22,.8,.3,1),visibility 0s}
.sb svg{transition:transform .25s cubic-bezier(.22,.8,.3,1),stroke .15s}
@keyframes optin{from{opacity:0;transform:translateY(-6px)}}
.sw.open .so{animation:optin .28s cubic-bezier(.22,.8,.3,1) both}
.sw.open .so:nth-child(2){animation-delay:.04s}.sw.open .so:nth-child(3){animation-delay:.08s}.sw.open .so:nth-child(4){animation-delay:.12s}.sw.open .so:nth-child(5){animation-delay:.16s}

.so{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;text-align:left;padding:10px 14px;border-radius:14px;cursor:pointer}
.so:hover{background:color-mix(in srgb,var(--ring) 10%,transparent)}
.so.on{background:color-mix(in srgb,var(--ring) 14%,transparent);color:var(--ring)}
.sl .so svg{position:static;margin:0;width:14px;height:14px;stroke:var(--ring);pointer-events:none}
.dsw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 16px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh)}
.dn{flex:none;width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--accink);cursor:pointer;transition:background .15s,transform .1s}
.dn:hover{opacity:.85}.dn:active{transform:scale(.93)}
.dn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dl{flex:1;border:0;background:none;color:var(--ink);font-family:inherit;text-align:center;padding:2px 6px;line-height:1.15}
button.dl{cursor:pointer}
.dl b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.dl small{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-top:2px}
#theme{border:0;background:none;box-shadow:none;border-radius:10px;font-size:21px;color:var(--ink);cursor:pointer}
.item .ed{flex:1;min-width:0;cursor:pointer}.item .ed:hover .n{color:var(--ring)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:2px 0 0;cursor:pointer}.chk input{width:18px;height:18px;padding:0;accent-color:var(--ring)}
.rr{display:flex;align-items:center}.rr .res{flex:1;width:auto}.rx{border:0;background:none;color:var(--mute);font-size:18px;padding:6px 8px;cursor:pointer}
.wh{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wchip{border:0;border-radius:999px;padding:6px 10px 6px 12px;background:color-mix(in srgb,var(--w) 12%,var(--card));color:var(--w);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}.wchip span{opacity:.6;margin-left:4px}
body{overflow-x:hidden}
@keyframes inR{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}

@keyframes ringin{from{stroke-dashoffset:440}}
.inR{animation:inR .34s cubic-bezier(.22,.8,.3,1) both}.inL{animation:inL .34s cubic-bezier(.22,.8,.3,1) both}
.bar i.grow,.wbar i.grow{transform-origin:left center;animation:grow .7s cubic-bezier(.22,.8,.3,1) both}
.fg.grow{animation:ringin .9s cubic-bezier(.22,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){.inR,.inL,.grow{animation:none!important}}

.tg.on{background:var(--f)}.tg.on i{transform:translateX(20px)}

.card.goal{background:var(--card);border:1px solid var(--line)}

document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(e.target.closest&&e.target.closest('.chips,input,.sl,.tabbar'))return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const n=dx<0?1:-1;
  if(tab==='cal'){dir=n;cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);render()}else shift(n);
},{passive:true});
function applyTheme(){const t=S.theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
applyTheme();render();
</script>
</body>
</html>
